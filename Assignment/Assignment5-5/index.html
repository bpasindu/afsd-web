<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment55</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="login">
      <div class="login1">
        <img src="./assets/leaf.png" alt="leaf" class="leaf1" />
        <img src="./assets/leaf-white.png" alt="leafwhite" class="leaf2" />
        <h3>Welcome Back</h3>
      </div>
      <div class="form">
        
        <div class="floating-label-group">
          <input
            type="text"
            id="username"
          />
          <label for="username">Username</label>
        </div>
        
        <div class="floating-label-group">
          <input
            type="password"
            id="password"
            class="password1"
          />
          <label for="password">Password</label>
          <i class="fa-solid fa-eye"></i>
        </div>
        <div class="form1">
          <label><input type="checkbox" id="checkbox" /> Remember me</label>
          <a href="forgot.html" class="forgot">Forgot Password</a>
        </div>
        <button class="btn">
          <a href="sign.html" class="sign">Sign In</a>
        </button>
      </div>
      <div class="or">
        <hr />
        <span>Or</span>
        <hr />
      </div>
      <button class="btn1">
        <img src="./assets/google.png" class="google" /><a
          href="signwithgoogle.html"
          class="signgoogle"
        >
          Sign in with Google</a
        >
      </button>
      <p class="p1">
        Don't have an account? <a href="signup.html" class="signup">Sign Up</a>
      </p>
    </div>

    <script
      src="https://kit.fontawesome.com/dcff7342ce.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
