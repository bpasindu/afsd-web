<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css</title>
    <style>
        .title{
            background-color:blue;
            color:white;
            border-radius:10px;
        }
    </style>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>CSS</h1>

    <a href="form.html">Form</a>

    <!-- Inline css -->
    <h2 style="background-color:red; color:white; border-radius:10px; ">ACPT</h2>

    <!-- Internal css-->
    <h2 class="title">ACPT</h2>

    <!-- External css-->
    <h2 class="title2">ACPT</h2>

    <button class="btn">ADD</button>

    <!-- Selector-->

    <!-- Id -->
    <h1 id="acpt">ACPT</h1>

    <!-- Class -->
    <h1 class="afsd">AFSD</h1>

    <!-- Type -->
    <h3>AFSD</h3>

    <!-- Universal -->

    <!-- Child -->
    <div>
        <h4>ACPT</h4>
        <p>
            <h4>acpt</h4>
        </p>
    </div>
    <h4>acpt</h4>

    <!-- Cascading-->

    <h3 class="me" id="me" style="background-color: rgb(213, 68, 177);" >ACPT cascading</h3>
    
    <h1 class="box">ACPT</h1>

    <h5 class="box1">ACPT</h5>

    <h5 class="box11">ACPT</h5>
</body>
</html>
